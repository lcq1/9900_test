# 文件职责 / File contract
# 功能 / Function: 运行前端、后端和端到端检查。 / Run frontend, backend, and end-to-end checks.
# 输入 / Input: 仓库源码、依赖清单和 CI 变量。 / Repository source, dependency manifests, and CI variables.
# 输出 / Output: 各流水线任务的检查结果。 / Results from each pipeline job.
# 状态 / Status: 当前只检查项目文件骨架；功能测试待实现。 / Currently checks the project scaffold only; functional tests are pending.

stages:
  - validate

validate_scaffold:
  stage: validate
  image: alpine:3.20
  script:
    - test -f README.md
    - test -f frontend/package.json
    - test -f backend/requirements.txt
    - grep -q 'Project File Tree' README.md
