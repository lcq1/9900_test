# Batch 0: CI pipeline configuration for Infra and Docs (Chara)
# 文件职责 / File contract
# 功能 / Function: 运行前端、后端和端到端检查。 / Run frontend, backend, and end-to-end checks.
# 输入 / Input: 仓库源码、依赖清单和 CI 变量。 / Repository source, dependency manifests, and CI variables.
# 输出 / Output: 各流水线任务的检查结果。 / Results from each pipeline job.

stages:
  - test
  - build

frontend_test:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test

backend_test:
  stage: test
  image: python:3.12
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: experiment_platform_test
    TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/experiment_platform_test
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m pytest -q

frontend_build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
