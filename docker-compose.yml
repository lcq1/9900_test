# Local development topology. Production deployments must provide HTTPS,
# managed secrets, backups, health checks and stricter container policies.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: experiment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # Local-only default; override outside development.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Linux container dependencies stay separate from Windows host dependencies.
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  # Named volume keeps local database data across container restarts.
  postgres_data:
  # Keep the frontend container's npm packages across restarts.
  frontend_node_modules:
