name: comp9900-beyond

services:
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Linux container dependencies stay separate from Windows host dependencies.
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  # Public hosting uses the separate docker-compose.production.yml.

  backend:
  #       condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-experiment_platform}}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me-in-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-experiment_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  # Named volume keeps local database data across container restarts.
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_postgres_data}"
  # Keep the frontend container's npm packages across restarts.
  frontend_node_modules:
  backend_storage:
    name: "${BACKEND_STORAGE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_backend_storage}"
  backend_logs:
    name: "${BACKEND_LOGS_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_backend_logs}"
